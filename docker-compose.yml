name: opspilot-stage1
services:
  db:
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_DB: opspilot
      POSTGRES_USER: opspilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${OPSPILOT_DB_PORT:-55432}:5432"
    volumes:
      - opspilot_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspilot -d opspilot"]
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://opspilot:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/opspilot
      WORKFLOW_DATABASE_URL: postgresql+psycopg://${WORKFLOW_DB_USER:-opspilot_wf_app}:${WORKFLOW_DB_PASSWORD:-}@db:5432/opspilot
      PYTHONPATH: /code/backend:/code
      EMBEDDING_CACHE: /home/opspilot/models/minilm
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen3.5:4b}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      HYBRID_LLM_ENABLED: ${HYBRID_LLM_ENABLED:-true}
      HYBRID_MODEL: ${HYBRID_MODEL:-qwen3.5:2b-q4_K_M}
      HYBRID_RESOURCE_FILE: /run/opspilot-runtime/resources.json
      HYBRID_ALLOW_LEGACY: ${HYBRID_ALLOW_LEGACY:-false}
      HYBRID_MODEL_TIMEOUT_SECONDS: ${HYBRID_MODEL_TIMEOUT_SECONDS:-8}
      HYBRID_MAX_MODEL_CALLS: ${HYBRID_MAX_MODEL_CALLS:-2}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_CONTEXT_TOKENS: ${OLLAMA_CONTEXT_TOKENS:-32768}
      OLLAMA_REFERENCE_OUTPUT: ${OLLAMA_REFERENCE_OUTPUT:-false}
      OLLAMA_TOOL_SELECTION: ${OLLAMA_TOOL_SELECTION:-false}
      OLLAMA_GPU_LAYERS: ${OLLAMA_GPU_LAYERS:-}
      OLLAMA_BATCH_TOKENS: ${OLLAMA_BATCH_TOKENS:-}
      AGENT_MAX_ROUNDS: ${AGENT_MAX_ROUNDS:-6}
      AGENT_MAX_TOOLS: ${AGENT_MAX_TOOLS:-12}
      AGENT_OUTPUT_TOKENS: ${AGENT_OUTPUT_TOKENS:-2000}
      AGENT_USAGE_TOKENS: ${AGENT_USAGE_TOKENS:-64000}
      AGENT_CONTEXT_BYTES: ${AGENT_CONTEXT_BYTES:-120000}
      AGENT_RESULT_BYTES: ${AGENT_RESULT_BYTES:-48000}
      AGENT_TIMEOUT_SECONDS: ${AGENT_TIMEOUT_SECONDS:-90}
      AGENT_TOOL_TIMEOUT_SECONDS: ${AGENT_TOOL_TIMEOUT_SECONDS:-10}
      AGENT_PROVIDER_TIMEOUT_SECONDS: ${AGENT_PROVIDER_TIMEOUT_SECONDS:-30}
      AGENT_RETRIES: ${AGENT_RETRIES:-0}
      LLM_PRICE_MODEL: ${LLM_PRICE_MODEL:-}
      LLM_INPUT_USD_PER_MILLION: ${LLM_INPUT_USD_PER_MILLION:-}
      LLM_OUTPUT_USD_PER_MILLION: ${LLM_OUTPUT_USD_PER_MILLION:-}
    volumes:
      - ./.models/minilm:/home/opspilot/models/minilm:ro
      - ./.local-tools/hybrid:/run/opspilot-runtime:ro
    ports:
      - "127.0.0.1:${OPSPILOT_API_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 5s
      timeout: 3s
      retries: 10
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
      APP_ORIGIN: http://127.0.0.1:${OPSPILOT_WEB_PORT:-3106}
      FRONTEND_SESSION_DIR: /app/.runtime
    ports:
      - "127.0.0.1:${OPSPILOT_WEB_PORT:-3106}:3000"
    volumes:
      - opspilot_frontend_sessions:/app/.runtime
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 4s
      retries: 12
volumes:
  opspilot_pgdata:
  opspilot_frontend_sessions:
