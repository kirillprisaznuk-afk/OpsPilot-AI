[project]
name = "opspilot-ai"
version = "0.4.0"
description = "Synthetic enterprise operations foundation"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.135,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.8,<3",
  "SQLAlchemy>=2.0.40,<2.1",
  "psycopg[binary]>=3.2.6,<4",
  "alembic>=1.15,<2",
  "pgvector>=0.4,<0.5",
  "onnxruntime>=1.20,<2",
  "tokenizers>=0.21,<1",
  "huggingface-hub>=0.30,<2",
  "numpy>=2,<3",
  "openai>=2,<3",
  "httpx>=0.28,<1",
  "argon2-cffi>=25.1,<26",
]
[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.12,<1"]
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "."]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.uv]
package = false
